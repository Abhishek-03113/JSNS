<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forms · MCQ Form Builder</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500&family=Inter:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/assets/styles.css">
</head>
<body>

<header class="top">
  <div class="top-inner">
    <a class="brand" href="/"><img src="/assets/favicon.svg" width="22" height="22" alt="">MCQ Form Builder</a>
    <nav class="nav" aria-label="Main">
      <a href="/">New quiz</a>
      <a href="/forms" aria-current="page">Forms</a>
      <a href="/connectors">Connectors</a>
    </nav>
    <div class="account">
      <img id="avatar" alt="" hidden referrerpolicy="no-referrer">
      <span id="account"></span>
      <button class="text-btn" id="signout" type="button">Sign out</button>
    </div>
  </div>
</header>

<main class="page">
  <div class="page-head">
    <h1 class="page-title">Forms</h1>
    <button class="btn btn-secondary" id="refresh" type="button">Refresh responses</button>
  </div>
  <div class="stats" id="stats">
    <div class="stat"><span class="stat-label">Forms</span><b class="num" id="st-forms">–</b></div>
    <div class="stat"><span class="stat-label">Questions</span><b class="num" id="st-questions">–</b></div>
    <div class="stat"><span class="stat-label">Responses</span><b class="num" id="st-responses">–</b></div>
  </div>
  <div class="tabs" role="tablist" aria-label="Show">
    <button class="tab" role="tab" id="tab-all" aria-selected="true" type="button">All</button>
    <button class="tab" role="tab" id="tab-created" aria-selected="false" type="button">Made</button>
    <button class="tab" role="tab" id="tab-failed" aria-selected="false" type="button">Failed</button>
  </div>
  <div class="form-list" id="list" aria-live="polite"></div>
</main>
<div class="toast" id="toast" role="status" hidden></div>
<script type="module" src="/assets/forms.js"></script>
</body>
</html>
